apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: topoviewconfigs.topoview.eda.edacommunity.com
spec:
  group: topoview.eda.edacommunity.com
  names:
    kind: TopoViewConfig
    listKind: TopoViewConfigList
    plural: topoviewconfigs
    singular: topoviewconfig
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Health
          type: string
          jsonPath: .status.health
        - name: Namespaces
          type: string
          jsonPath: .status.discoveredNamespaces
        - name: Message
          type: string
          jsonPath: .status.message
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                namespaceExclude:
                  type: array
                  items:
                    type: string
                refresh:
                  type: string
                  default: "5s"
                roleTiers:
                  type: object
                  additionalProperties:
                    type: integer
                prometheusDatasourceUid:
                  type: string
                  default: "PBFA97CFB590B2093"
                thresholds:
                  type: object
                  properties:
                    traffic:
                      type: array
                      items:
                        type: object
                        properties:
                          color:
                            type: string
                          level:
                            type: integer
                            format: int64
                        required: [color, level]
                    operState:
                      type: array
                      items:
                        type: object
                        properties:
                          color:
                            type: string
                          level:
                            type: integer
                            format: int64
                        required: [color, level]
            status:
              type: object
              properties:
                health:
                  type: string
                message:
                  type: string
                lastReconcileTime:
                  type: string
                discoveredNamespaces:
                  type: array
                  items:
                    type: string
                menuDashboardUid:
                  type: string
                version:
                  type: string
                dashboards:
                  type: array
                  items:
                    type: object
                    properties:
                      namespace:
                        type: string
                      uid:
                        type: string
                      nodeCount:
                        type: integer
                      linkCount:
                        type: integer
                      generationHash:
                        type: string
